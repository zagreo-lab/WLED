[platformio]
default_envs = retrix_build

[env:retrix_build]
extends = env:waveshare_esp32s3_32MB_hub75

custom_usermods =
  usermods/static_text
  usermod_asyncWSClient = symlink://./usermods/usermod_asyncWSClient
  usermod_retrix_wg


build_unflags = ${env:waveshare_esp32s3_32MB_hub75.build_unflags}
  -D WLED_RELEASE_NAME=\"ESP32-S3_Waveshare_HUB75\"

build_flags = ${env:waveshare_esp32s3_32MB_hub75.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32-S3_Waveshare_HUB75_Retrix\"
  ;; Forza il compilatore a includere mbedTLS e la gestione PSRAM corretta
  -D BOARD_HAS_PSRAM
  -D WLED_DEBUG


